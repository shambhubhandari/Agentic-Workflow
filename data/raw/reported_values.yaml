# Values reported in the manuscript, with provenance and a recompute function.
#
# population: which set the value is computed over. These are NOT interchangeable:
#   expert-labels    25 hand-labelled papers, 201 judgements — every accuracy figure
#   audited-corpus   the pipeline's own output: 69 retrieved, 62 extracted, 57 audited
#   hardware-logs    inference-server behaviour, from the shipped log excerpt
#   tier2-targets    the 8 axis-matched lattice comparisons that survive the Critic
#
# Authored input, immutable: this is the record of what the paper states. Verification
# results are written to data/processed/verification_report.json.
#
# disposition:
#   promote   recomputed from shipped artefacts by `verify:`
#   pinned    not recomputable from data; `evidence:` names a log excerpt, file:line
#   external  third-party value, cited not recomputed
#
# `note:` records how the population was defined, which is where these numbers actually
# go wrong. A tolerance of 0.05 accepts the rounding the manuscript prints.

