name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Verify (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,verify]"

      - name: Byte-compile checks
        run: |
          python -m compileall -q src scripts

      - name: Run unit tests
        run: |
          pytest -v tests/

      - name: Run verification registry (60 claims)
        run: |
          python scripts/verify.py --json

      - name: Score expert labels
        run: |
          python scripts/score_labels.py

      - name: Check manuscript numbers generator
        run: |
          python scripts/manuscript_numbers.py
