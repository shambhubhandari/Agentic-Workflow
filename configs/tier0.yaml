# =============================================================================
#                      ********* PIPELINE TIER 0 *********                     
#               Strict definition of theoretical reproducibility.              
# =============================================================================

# =============================================================================
#                       ********* REPORTABILITY *********                      
#                      Baseline calculation requirements.                      
# =============================================================================
reportability:
  universal_required:
    - xc_functional
    - pseudopotential_type
    - k_mesh
    - force_threshold_ev_ang
    - energy_threshold_ev

  twod_required:
    - vacuum_spacing_ang

  plane_wave_required:
    - plane_wave_cutoff_ev
  nao_required:
    - mesh_cutoff_ry
    - basis_size

  plane_wave_codes: [vasp, quantum_espresso, castep, abinit]
  nao_codes: [siesta, cp2k]

# =============================================================================
#                        ********* VALIDATION *********                        
#                     Physical plausibility range schemas.                     
# =============================================================================
validation:
  ranges:
    plane_wave_cutoff_ev:  [20.0, 2000.0]
    augmentation_cutoff_ev: [100.0, 5000.0]
    mesh_cutoff_ry:        [50.0, 2000.0]
    pao_energy_shift_ev:   [0.0001, 1.0]
    basis_split_norm:      [0.0, 1.0]
    vacuum_spacing_ang:    [5.0, 60.0]
    force_threshold_ev_ang: [0.0001, 1.0]
    energy_threshold_ev:   [1.0e-12, 0.1]
    thickness_for_gpa_conversion_ang: [1.0, 30.0]

# =============================================================================
#                         ********* CROSSREF *********                         
#                       External structure database URIs.                      
# =============================================================================
crossref:
  providers:
    2dmatpedia: http://optimade.2dmatpedia.org/v1/structures
    jarvis_dft: https://jarvis.nist.gov/optimade/jarvisdft/v1/structures

# =============================================================================
#                          ********* SCREEN *********                          
#                      Tier 1 triage model configuration.                      
# =============================================================================
screen:
  model: mace-mp
  limit_per_formula: 6            # candidate structures per composition
